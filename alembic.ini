# Alembic configuration for the Telegram file bot.
# The database URL is read from application settings (DATABASE_URL) in
# bot/db/migrations/env.py, so it does not need to be set here.

[alembic]
script_location = bot/db/migrations
prepend_sys_path = .
path_separator = os
compare_type = true

# Placeholder; overridden at runtime by env.py from DATABASE_URL.
sqlalchemy.url = postgresql+asyncpg://bot:bot@localhost:5432/tgbot

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
